name: "Hermes Agent"
image: vastai/hermes-agent
tag: "v2026.7.20-cuda-12.9"
href: https://hub.docker.com/r/vastai/hermes-agent/
repo: vastai/hermes-agent
desc: "Hermes Agent dashboard backed by a private local llama.cpp server."
recommended_disk_space: 30.0
private: false
readme_visible: true
onstart: entrypoint.sh
jup_direct: true
ssh_direct: true
use_ssh: true
use_jupyter_lab: false
runtype: jupyter
ports:
  - "1111:1111"
  - "8080:8080"
  - "9119:9119"
  - "8000:18000"
env:
  OPEN_BUTTON_PORT: "1111"
  OPEN_BUTTON_TOKEN: "1"
  JUPYTER_DIR: "/"
  DATA_DIRECTORY: "/workspace/"
  HERMES_MODEL: "unsloth/Qwen3.6-27B-GGUF:UD-Q4_K_XL"
  LLAMA_ARGS: "--host 127.0.0.1 --port 18000"
  HERMES_DASHBOARD_ARGS: "--host 0.0.0.0 --port 9119 --no-open"
  HERMES_MODEL_BASE_URL: "http://127.0.0.1:18000/v1"
  PORTAL_CONFIG: "localhost:1111:11111:/:Instance Portal|localhost:9119:9119:/:Hermes Dashboard|localhost:8000:18000:/:llama.cpp API|localhost:8080:18080:/:Jupyter|localhost:8080:8080:/terminals/1:Jupyter Terminal"
  AUTH_EXCLUDE: "9119,8000"
extra_filters:
  compute_cap:
    gte: 750
