name: Push Hermes Agent to GHCR

env:
  IMAGE_NAME: ghcr.io/y0ucef/hermes-agent-llama-cpp
  HERMES_REF: v2026.7.31
  LLAMA_CPP_REF: b10182-cuda-12.9

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'ROOT/**'
      - '.github/workflows/push-hermes-to-ghcr.yml'
  workflow_dispatch:

concurrency:
  group: push-hermes-to-ghcr
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            HERMES_REF=${{ env.HERMES_REF }}
            LLAMA_CPP_REF=${{ env.LLAMA_CPP_REF }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.HERMES_REF }}-${{ env.LLAMA_CPP_REF }}
